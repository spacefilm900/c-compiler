[package]
name = "hcc"
version = "1.0.1"
edition = "2021"
publish = false
description = "Haviland C Compiler (hcc): a clean-room C11 compiler that emits textual LLVM IR"
authors = ["Keith Haviland"]
license = "MIT"
repository = "https://github.com/spacefilm900/c-compiler"
readme = "README.md"
rust-version = "1.85"
build = "build.rs"

[[bin]]
name = "hcc"
path = "src/main.rs"
