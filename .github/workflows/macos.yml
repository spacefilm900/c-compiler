# Native macOS check on an Apple Silicon runner. macOS minutes cost about
# ten times Linux minutes, so this runs only after a merge to main and by
# hand (Actions > macos > Run workflow, or `gh workflow run macos.yml`);
# never on pull requests or other branches. Budget: about 6 minutes; the
# first runs took under a minute.

name: macos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS arm64 native (build, unit tests, run_tests, hello)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      # No cargo cache: the crate has no dependencies, and a cold release
      # build takes well under a minute, about what restoring and saving
      # target/ would cost.
      - name: Tools
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          rustc --version
          # /usr/bin/clang is Apple's driver shim; it finds the SDK the
          # same way a user's Terminal does. SDKROOT makes the choice
          # explicit for both compilers.
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "${sdk}"
          /usr/bin/clang --version
          python3 --version

      - name: Build
        run: make

      - name: Unit tests
        run: cargo test --offline --lib

      - name: Hello, world (docs/USER_GUIDE_MACOS.md)
        run: |
          set -euo pipefail
          build/compiler harness/macos/hello.c -o hello.ll
          grep -q 'target triple = "arm64-apple-macosx' hello.ll
          "${CLANG}" hello.ll -o hello
          file hello
          out="$(./hello)"
          echo "${out}"
          test "${out}" = "Hello from the clean-room compiler on macOS"

      - name: Differential harness with Apple Clang as the oracle
        if: success() || failure()
        env:
          KNOWN_FAILURES: harness/macos_known_failures.txt
        run: python3 harness/run_tests.py

      - name: SDK header report (does not fail the job)
        if: always()
        run: sh harness/macos/sdk_headers.sh
