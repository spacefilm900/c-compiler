# Native macOS check on an Apple Silicon runner. macOS minutes cost about
# ten times Linux minutes, so this runs only after a merge to main and by
# hand (Actions > macos > Run workflow, or `gh workflow run macos.yml`);
# never on pull requests or other branches. Budget: about 6 minutes; the
# first runs took under a minute.
#
# The DOOM job runs only when started by hand with the "doom" box ticked
# (`gh workflow run macos.yml -f doom=true`), so merges to main stay cheap.
#
# The Intel job (PLAN.md step 10) runs only by hand, on GitHub's Intel
# runner, when the "intel" input is not "off":
#   gh workflow run macos.yml --ref BRANCH -f intel=all -f arm64=false
# It never runs on a push, a pull request or a schedule. "all" takes about
# 25 minutes of Intel macOS time; "torture" builds and runs only GCC
# torture. Day-to-day Intel macOS coverage is the Linux stand-in in ci.yml
# (harness/intel_mac_proxy.py).

name: macos

on:
  push:
    branches: [main]
    # A merge that changes only documentation does not run the Mac job.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      doom:
        description: "Also build DOOM natively: frame hashes against Apple clang at -O0 and -O2, and the SDL2 window build (docs/DOOM_ON_MAC.md)"
        type: boolean
        default: false
      arm64:
        description: "Run the Apple Silicon native job"
        type: boolean
        default: true
      intel:
        description: "Intel macOS job (macos-26-intel): off, all (build, unit tests, harness, Lua, SQLite, DOOM, GCC torture), or torture (GCC torture only)"
        type: choice
        options: ["off", "all", "torture"]
        default: "off"

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: macOS arm64 native (build, unit tests, run_tests, hello)
    if: github.event_name != 'workflow_dispatch' || inputs.arm64
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      # No cargo cache: the crate has no dependencies, and a cold release
      # build takes well under a minute, about what restoring and saving
      # target/ would cost.
      - name: Tools
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          rustc --version
          # /usr/bin/clang is Apple's driver shim; it finds the SDK the
          # same way a user's Terminal does. SDKROOT makes the choice
          # explicit for both compilers.
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "${sdk}"
          /usr/bin/clang --version
          python3 --version

      - name: Build
        run: make

      - name: Unit tests
        run: cargo test --offline --lib

      - name: Hello, world (docs/USER_GUIDE_MACOS.md)
        run: |
          set -euo pipefail
          build/compiler harness/macos/hello.c -o hello.ll
          grep -q 'target triple = "arm64-apple-macosx' hello.ll
          "${CLANG}" hello.ll -o hello
          file hello
          out="$(./hello)"
          echo "${out}"
          test "${out}" = "Hello from the clean-room compiler on macOS"

      - name: Differential harness with Apple Clang as the oracle
        if: success() || failure()
        env:
          KNOWN_FAILURES: harness/macos_known_failures.txt
        run: python3 harness/run_tests.py

      - name: SDK header report (does not fail the job)
        if: always()
        run: sh harness/macos/sdk_headers.sh

  doom:
    name: macOS arm64 DOOM (frame hashes vs Apple clang, SDL2 window build)
    if: github.event_name == 'workflow_dispatch' && inputs.doom
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      - name: Tools
        run: |
          set -euo pipefail
          sw_vers
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          /usr/bin/clang --version

      - name: Build DOOM both ways and compare frame hashes at -O0 and -O2, every demo to its end
        run: |
          set -euo pipefail
          scripts/fetch_doomgeneric.sh
          scripts/fetch_freedoom.sh
          make
          python3 harness/run_doom.py --opt O0 --opt O2 --play-jobs "$(sysctl -n hw.ncpu)" \
            --json build/doom-mac.json --scorecard build/doom-mac.md --title "DOOM on macOS arm64"

      - name: Install SDL2 with Homebrew (docs/DOOM_ON_MAC.md)
        if: success() || failure()
        run: |
          set -euo pipefail
          brew install sdl2
          sdl2-config --version --cflags --libs

      # The command from the guide, with test settings: no screen (the dummy
      # video driver), scripted key presses through SDL's event queue, a
      # timed exit, and the last frame saved as a picture.
      - name: Build and launch the SDL2 game with ./tools/mac/play_doom.sh
        if: success() || failure()
        env:
          SDL_VIDEODRIVER: dummy
          DOOM_EXIT_AFTER_MS: "8000"
          DOOM_TEST_KEYS: "1"
          DOOM_SCREENSHOT: ${{ github.workspace }}/build/doom-dummy.ppm
        run: |
          set -euo pipefail
          ./tools/mac/play_doom.sh | tee build/doom-dummy.log
          grep -q 'exiting after 8000 ms as asked' build/doom-dummy.log
          test -s build/doom-dummy.ppm
          sips -s format png build/doom-dummy.ppm --out build/doom-dummy.png
          otool -L build/doom-sdl/doom

      # The real macOS window (Cocoa) on the runner's desktop. A runner may
      # not allow a window, so this step reports but does not fail the job.
      - name: Launch in a real window for a few seconds (does not fail the job)
        if: success() || failure()
        continue-on-error: true
        env:
          DOOM_EXIT_AFTER_MS: "6000"
          DOOM_TEST_KEYS: "1"
          DOOM_SCREENSHOT: ${{ github.workspace }}/build/doom-window.ppm
        run: |
          set -euo pipefail
          ./tools/mac/play_doom.sh | tee build/doom-window.log &
          sleep 5
          screencapture -x build/doom-desktop.png || echo "screencapture was not allowed"
          wait
          grep 'exiting after' build/doom-window.log

      - name: Upload the DOOM report and pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doom-macos
          path: |
            build/doom-mac.json
            build/doom-mac.md
            build/doom-*.log
            build/doom-*.png
          if-no-files-found: warn

  intel:
    name: macOS x86_64 (Intel) native (build, unit tests, run_tests, Lua, SQLite, DOOM, torture)
    if: github.event_name == 'workflow_dispatch' && inputs.intel != 'off'
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      ALL: ${{ inputs.intel == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      - name: Tools
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = x86_64
          sysctl -n machdep.cpu.brand_string hw.ncpu
          rustc --version
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${sdk}" >> "$GITHUB_ENV"
          echo "CLANG=/usr/bin/clang" >> "$GITHUB_ENV"
          echo "JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          echo "${sdk}"
          /usr/bin/clang --version
          python3 --version
          mkdir -p build

      - name: Build
        run: make

      - name: Unit tests
        if: env.ALL == 'true'
        run: cargo test --offline --lib

      - name: Hello, world
        if: env.ALL == 'true'
        run: |
          set -euo pipefail
          build/compiler harness/macos/hello.c -o hello.ll
          grep -q 'target triple = "x86_64-apple-macosx' hello.ll
          "${CLANG}" hello.ll -o hello
          file hello
          out="$(./hello)"
          echo "${out}"
          test "${out}" = "Hello from the clean-room compiler on macOS"

      - name: Differential harness with Apple Clang as the oracle
        if: env.ALL == 'true' && (success() || failure())
        env:
          KNOWN_FAILURES: harness/macos_x86_64_known_failures.txt
        run: python3 harness/run_tests.py

      - name: SDK header report (does not fail the job)
        if: env.ALL == 'true' && always()
        run: sh harness/macos/sdk_headers.sh

      - name: Lua 5.4.7 both ways at -O0 and -O2 (test suite, workloads, bytecode)
        if: env.ALL == 'true' && (success() || failure())
        run: |
          set -euo pipefail
          scripts/fetch_lua.sh
          python3 harness/run_lua.py --opt O0 --opt O2 --run-jobs "${JOBS}" \
            --json build/lua-mac-x86_64.json --scorecard build/lua-mac-x86_64.md --title "Lua on macOS x86_64"

      - name: SQLite 3.54.1 both ways at -O0 and -O2 (shell workloads)
        if: env.ALL == 'true' && (success() || failure())
        run: |
          set -euo pipefail
          scripts/fetch_sqlite.sh
          python3 harness/run_sqlite.py --opt O0 --opt O2 \
            --json build/sqlite-mac-x86_64.json --scorecard build/sqlite-mac-x86_64.md --title "SQLite on macOS x86_64"

      - name: DOOM frame hashes against Apple Clang at -O0 and -O2, every demo to its end
        if: env.ALL == 'true' && (success() || failure())
        run: |
          set -euo pipefail
          scripts/fetch_doomgeneric.sh
          scripts/fetch_freedoom.sh
          python3 harness/run_doom.py --opt O0 --opt O2 --play-jobs "${JOBS}" \
            --json build/doom-mac-x86_64.json --scorecard build/doom-mac-x86_64.md --title "DOOM on macOS x86_64"

      - name: GCC torture execute (x86_64 list with the macOS overlay)
        if: success() || failure()
        run: |
          set -euo pipefail
          scripts/fetch_gcc_torture.sh
          python3 harness/run_gcc_torture.py --jobs "${JOBS}" 2>&1 | tee build/torture-mac-x86_64.log

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-x86_64
          path: |
            build/*-mac-x86_64.json
            build/*-mac-x86_64.md
            build/torture-mac-x86_64.log
          if-no-files-found: warn
