# Runs once per change: on pull requests, and on pushes to main (merges).
# A branch push without a pull request does not run CI; open a PR or start
# it by hand (Actions > ci > Run workflow, or `gh workflow run ci.yml --ref <branch>`).
# Changes that touch only documentation (Markdown files, docs/, LICENSE) skip CI.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests, harness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, and Python
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3
          echo "rustc $(rustc --version)"
          echo "cargo $(cargo --version)"
          clang --version
          llvm-as --version
          make --version
          python3 --version
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --offline --lib

      - name: Release build and differential harness
        run: |
          set -euo pipefail
          make
          python3 harness/run_tests.py

      - name: Csmith campaign script tests
        run: python3 -m unittest tools/test_csmith_campaign.py tools/test_run_doom.py tools/test_run_lua.py tools/test_run_quickjs.py tools/test_run_sqlite.py tools/test_perf_tools.py tools/test_abi_fuzz.py tools/test_hardening_tools.py

      - name: Stage dump golden tests and reducer unit tests
        run: |
          set -euo pipefail
          python3 harness/run_dump_tests.py
          python3 -m unittest tools/reduce/test_reduce.py

      # The arm64 targets and Intel macOS, checked on this Linux runner (no
      # macOS runner): IR signatures against Clang and llc acceptance
      # (Mach-O objects for arm64-apple-macos and x86_64-apple-macos), then the differential harness under qemu-aarch64
      # for AArch64 Linux and for the Apple calling-convention proxy. See
      # docs/USER_GUIDE_MACOS.md for what this does not cover.
      - name: Install the AArch64 cross toolchain and qemu
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh qemu-user libc6-dev-arm64-cross libgcc-13-dev-arm64-cross binutils-aarch64-linux-gnu
          qemu-aarch64 --version

      - name: arm64 and Intel macOS IR and llc checks
        run: python3 harness/run_arm64_ir.py

      - name: arm64 differential harness under qemu
        run: |
          set -euo pipefail
          python3 harness/run_cross.py --target aarch64-linux-gnu
          python3 harness/run_cross.py --target arm64-apple-macos

      # Intel macOS (x86_64-apple-macos) through its x86_64 Linux stand-in
      # (harness/intel_mac_proxy.py): the differential harness and 100
      # random calling-convention pairs with __int128. The real Mac job is
      # manual only (.github/workflows/macos.yml).
      - name: Intel macOS stand-in (harness and random ABI pairs)
        run: |
          set -euo pipefail
          python3 harness/run_cross.py --target x86_64-apple-macos
          python3 tools/abi_fuzz.py --count 100 --int128 --target x86_64-apple-macos

  windows-standin:
    # 64-bit Windows (PLAN.md step 11) on Linux: MinGW-w64 objects linked by
    # x86_64-w64-mingw32-gcc and run under Wine, and the MSVC type model on
    # MinGW-w64's headers (harness/windows_x64.py). The real MSVC headers,
    # linker and CRT are checked by the manual job in windows.yml.
    name: Windows x64 stand-in (MinGW-w64 and MSVC under Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      - name: Install Clang, LLVM, MinGW-w64 and Wine
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3 gcc-mingw-w64-x86-64 wine wine64
          clang --version
          x86_64-w64-mingw32-gcc --version
          wine --version

      - name: Build
        run: make

      - name: Signatures against Clang and COFF objects from llc
        run: python3 harness/run_arm64_ir.py --target x86_64-w64-windows-gnu --target x86_64-pc-windows-msvc

      - name: Differential harness under Wine
        run: |
          set -euo pipefail
          python3 harness/run_cross.py --target x86_64-w64-windows-gnu
          python3 harness/run_cross.py --target x86_64-pc-windows-msvc

      - name: Random calling-convention pairs under Wine
        run: |
          set -euo pipefail
          python3 tools/abi_fuzz.py --count 100 --int128 --target x86_64-w64-windows-gnu
          python3 tools/abi_fuzz.py --count 100 --int128 --target x86_64-pc-windows-msvc

