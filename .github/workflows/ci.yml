# Runs once per change: on pull requests, and on pushes to main (merges).
# A branch push without a pull request does not run CI; open a PR or start
# it by hand (Actions > ci > Run workflow, or `gh workflow run ci.yml --ref <branch>`).
# Changes that touch only documentation (Markdown files, docs/, LICENSE) skip CI.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests, harness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, and Python
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3
          echo "rustc $(rustc --version)"
          echo "cargo $(cargo --version)"
          clang --version
          llvm-as --version
          make --version
          python3 --version
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --offline --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --offline --lib

      - name: Release build and differential harness
        run: |
          set -euo pipefail
          make
          python3 harness/run_tests.py

      - name: Csmith campaign script tests
        run: python3 -m unittest tools/test_csmith_campaign.py tools/test_run_doom.py tools/test_run_lua.py tools/test_run_sqlite.py tools/test_perf_tools.py

      - name: Stage dump golden tests and reducer unit tests
        run: |
          set -euo pipefail
          python3 harness/run_dump_tests.py
          python3 -m unittest tools/reduce/test_reduce.py

      # The arm64 targets, checked on this Linux runner (no macOS runner):
      # IR signatures against Clang and llc acceptance (Mach-O objects for
      # arm64-apple-macos), then the differential harness under qemu-aarch64
      # for AArch64 Linux and for the Apple calling-convention proxy. See
      # docs/USER_GUIDE_MACOS.md for what this does not cover.
      - name: Install the AArch64 cross toolchain and qemu
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh qemu-user libc6-dev-arm64-cross libgcc-13-dev-arm64-cross binutils-aarch64-linux-gnu
          qemu-aarch64 --version

      - name: arm64 IR and llc checks
        run: python3 harness/run_arm64_ir.py

      - name: arm64 differential harness under qemu
        run: |
          set -euo pipefail
          python3 harness/run_cross.py --target aarch64-linux-gnu
          python3 harness/run_cross.py --target arm64-apple-macos

  wacc:
    name: writing-a-c-compiler suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, and Python
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3
          echo "rustc $(rustc --version)"
          echo "cargo $(cargo --version)"
          clang --version
          llvm-as --version
          make --version
          python3 --version
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the fetched test suite
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/wacc
          key: wacc-ae12014d2dec14488f3f80d14df4b6d8e4634d7d-${{ runner.os }}

      - name: Fetch the pinned suite and run it
        run: |
          set -euo pipefail
          scripts/fetch_wacc_tests.sh
          make
          python3 harness/run_wacc.py

  csmith:
    name: csmith differential
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, Python, and a C++ compiler
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3 g++
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the pinned Csmith build
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/csmith
          key: csmith-30dccd73b78652c4719f36572994778a5b233a4e-${{ runner.os }}

      - name: Fixed Csmith seeds
        run: |
          set -euo pipefail
          scripts/fetch_csmith.sh
          make
          python3 harness/run_csmith.py

  onetrueawk:
    name: one true awk
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, Python, and bison
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3 bison
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the pinned One True AWK tree
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/onetrueawk
          key: onetrueawk-5739fd79bcfc75ba7526773d0cf634521f8aca3c-${{ runner.os }}

      - name: Build both awks and compare the upstream suite
        run: |
          set -euo pipefail
          scripts/fetch_onetrueawk.sh
          make
          python3 harness/run_onetrueawk.py

      - name: AWK Builder suites
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ secrets.AWK_SUITE_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "SKIP: AWK Builder suites need the AWK_SUITE_READ_TOKEN secret."
            echo "Forks, and runs before that secret exists, do not clone the private suites."
            exit 0
          fi
          scripts/build_onetrueawk.sh clang build/otawk-clang
          scripts/build_onetrueawk.sh ccomp build/otawk-ccomp
          scripts/fetch_awk_posix_challenge.sh
          scripts/fetch_awk_volume.sh
          AWK_CLANG="$PWD/build/otawk-clang/awk" \
            AWK_CCOMP="$PWD/build/otawk-ccomp/awk" \
            python3 harness/run_awk_extra.py

  gcc-torture:
    name: gcc torture execute
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, and Python
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the pinned execute tests
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/gcc-torture
          key: gcc-torture-5115c7e447fc07457443df874bf57840e8316d5f-${{ runner.os }}

      - name: Run gcc.c-torture/execute
        run: |
          set -euo pipefail
          scripts/fetch_gcc_torture.sh
          make
          python3 harness/run_gcc_torture.py

  perf:
    name: performance numbers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, Python, and bison
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3 bison
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the pinned One True AWK tree
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/onetrueawk
          key: onetrueawk-5739fd79bcfc75ba7526773d0cf634521f8aca3c-${{ runner.os }}

      - name: Time compile and run
        run: |
          set -euo pipefail
          scripts/fetch_onetrueawk.sh
          make
          python3 harness/perf.py

      - name: Upload raw performance numbers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf-numbers
          path: reports/perf.json
          if-no-files-found: error

  doom:
    name: doom frame hashes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"
          components: rustfmt, clippy

      - name: Install Clang, LLVM, make, Python, and unzip
        run: |
          set -euo pipefail
          scripts/ci-apt-install.sh clang llvm make python3 unzip
          major="$(clang --version | sed -n 's/.*version \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          if [ -z "${major}" ] || [ "${major}" -lt 18 ]; then
            echo "Clang/LLVM >= 18 is required. Got: $(clang --version | head -n 1)" >&2
            exit 1
          fi

      - name: Cache the pinned doomgeneric tree
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/doomgeneric
          key: doomgeneric-e257a09527062bfb986b6e5e0780839b6cbd5b71-${{ runner.os }}

      - name: Cache the Freedoom WAD
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/freedoom
          key: freedoom-0.13.0-7323bcc168c5a45ff10749b339960e98314740a734c30d4b9f3337001f9e703d-a8772e088847032510d97ba2312406a6998f21cbab44d4ff10696faa9c0ecd4b-${{ runner.os }}

      - name: Build DOOM both ways and compare frame hashes at -O0 and -O2, every demo to its end
        run: |
          set -euo pipefail
          scripts/fetch_doomgeneric.sh
          scripts/fetch_freedoom.sh
          make
          python3 harness/run_doom.py --opt O0 --opt O2 --play-jobs "$(nproc)"

  lua:
    name: lua test suite and workloads
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
