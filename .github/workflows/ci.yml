            exit 1
          fi

      - name: Cache the SQLite 3.54.1 amalgamation
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tests/external/sqlite
          key: sqlite-3.54.1-0a9c8e34352dad46006aa82836d5383bff9dc6bc9ce5a60553c05aa30e6ad1f9-92281c86e2957f9b9305890f9ac04204caa7b677cc868dc326d942689df28e30-${{ runner.os }}

      - name: Build SQLite both ways and compare workloads at -O0 and -O2
        run: |
          set -euo pipefail
          scripts/fetch_sqlite.sh
          make
          python3 harness/run_sqlite.py --opt O0 --opt O2

      - name: Compile-time guard (frontend vs clang -O0 on sqlite3.c and shell.c)
        run: python3 tools/perf_guard.py
