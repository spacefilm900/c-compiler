        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/external/zlib
          key: zlib-1.3.1-9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23-${{ runner.os }}

      - name: zlib harness unit tests
        run: python3 -m unittest tools/test_run_zlib.py

      - name: Build zlib both ways and compare its tests and a compression round trip at -O0 and -O2
        run: |
          set -euo pipefail
          scripts/fetch_zlib.sh
          make
          python3 harness/run_zlib.py --opt O0 --opt O2 --jobs "$(nproc)"
