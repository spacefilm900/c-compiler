# Checks the documentation's language claims (tools/check_docs.py) when a
# pull request changes documentation. ci.yml skips documentation-only
# changes, so this workflow covers them; ci.yml runs the same check for
# every other change.

name: docs

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - 'tools/check_docs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claims:
    name: documentation claims
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85.1"

      - name: Install Clang, LLVM, make, and Python
        run: scripts/ci-apt-install.sh clang llvm make python3

      - name: Build and check the documentation claims
        run: |
          set -euo pipefail
          make
          python3 tools/check_docs.py
