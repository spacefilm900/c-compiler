# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Configuration only. Installing this file does not install the CodeRabbit
# GitHub App and does not start reviews. The app installation is separate.
language: en-US
early_access: false
tone_instructions: >-
  Review this clean-room C subset compiler on its own terms. Do not suggest
  copying or adapting Clang, GCC, or any other C compiler frontend.
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  auto_approvals:
    enabled: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        The frontend is original. Do not recommend reading, copying, translating, or closely adapting Clang, GCC, or another C compiler's source.
        Flag incorrect C semantics, silently accepted unsupported syntax, and LLVM IR that would not assemble.
        Do not ask for language features outside the subset documented in README.md and STATUS.md.
    - path: "tests/**/*.c"
      instructions: |
        These are differential smoke programs for this compiler, compared with Clang only as a black-box oracle.
        Keep them inside the documented subset. Do not add headers or preprocessor directives.
        A test may call a C library function only by declaring the prototype in the file, for example `int printf(const char *, ...);`, `int puts(const char *);`, `int putchar(int);`, or `unsigned long strlen(const char *);`. Do not include a header for that declaration.
    - path: "harness/**/*.py"
      instructions: |
        Preserve the harness contract: build/hcc INPUT.c -o OUTPUT.ll, then compare the program's exit status and output with Clang.
        Do not replace this runner with a call into a C compiler frontend.
        harness/run_wacc.py runs the external Writing a C Compiler suite. It must not invoke that suite's test_compiler script.
        Invalid programs must be a non-zero exit with no panic. Do not vendor the suite.
    - path: "harness/wacc_known_failures.txt"
      instructions: |
        One suite-relative test path per line, then a short reason category.
        Do not add a line for a crash, a panic, or a small bug in a feature this compiler already documents as supported.
    - path: "scripts/**"
      instructions: |
        scripts/fetch_wacc_tests.sh must keep the pinned commit. Do not vendor the fetched tree.
    - path: ".github/workflows/**"
      instructions: |
        This workflow is in the tree for import and has not been observed to run on GitHub.
        Keep permissions at contents: read. Pin actions to full commit SHAs. Do not add write tokens.
    - path: "Makefile"
      instructions: |
        make must keep producing build/hcc. The test target must keep running python3 harness/run_tests.py.
